<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My One Question ❤️</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2b0a3d, #000);
      overflow: hidden;
      color: white;
    }
    .spotlight {
      position: absolute;
      width: 120vmax;
      height: 120vmax;
      background: radial-gradient(circle, rgba(255,0,100,0.25), transparent 60%);
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    .card {
      position: relative;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      z-index: 2;
    }
    h1 {
      font-size: 2.6rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #ff4d6d, #ffd6e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: #f8fafc;
      margin-bottom: 2.5rem;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    button {
      border: none;
      padding: 0.9rem 1.9rem;
      font-size: 1.05rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .yes {
      background: linear-gradient(135deg, #ff1e56, #ff6b81);
      color: white;
      box-shadow: 0 12px 30px rgba(255,30,86,0.6);
    }
    .no {
      background: rgba(255,255,255,0.15);
      color: #f1f5f9;
    }
    button:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .petals span {
      position: absolute;
      top: -10vh;
      font-size: 1.2rem;
      animation: fall linear infinite;
      opacity: 0.8;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <audio id="bgm" src="https://cdn.pixabay.com/audio/2022/10/30/audio_5c1b2c5d3b.mp3" preload="auto"></audio>
  <audio id="heartbeat" src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c3b8b2e2c.mp3" preload="auto"></audio>
  <div class="spotlight"></div>

  <div class="card" id="card">
    <img src="photo.jpg" alt="Us ❤️" style="width:180px;margin-bottom:1rem;border-radius:18px;box-shadow:0 10px 30px rgba(255,105,135,0.6);" />
    <h1>Himanshu… ❤️</h1>
    <p>
      They say some love stories are written quietly.<br/>
      But ours… it refuses to be silent.
      <br/><br/>
      Every stolen glance, every unsaid feeling,
      every moment where my heart chose you — again and again.
      <br/><br/>
      And now, standing here — as Jalpa —
      with all my courage gathered in this one moment…
    </p>
    <div class="buttons">
      <button class="yes" onclick="sceneTwo()">Continue 🎬</button>
    </div>
  </div>
  </div>

  <div class="petals" id="petals"></div>

  <script>
    function sceneTwo() {
      document.getElementById('bgm').play();
      document.getElementById('card').innerHTML = `
        <h1>This Is My Truth 💫</h1>
        <p>
          If love were a film,<br/>
          you’d be the moment the music slows down.
          <br/><br/>
          The pause before the confession.
          The scene that changes everything.
          <br/><br/>
          Himanshu… you feel like home.
          And my heart has already made its choice.
        </p>
        <div class="buttons">
          <button class="yes" onclick="finalScene()">One Last Question 💍</button>
        </div>
      `;
    }

    function finalScene() {
      const hb = document.getElementById('heartbeat'); hb.currentTime = 0; hb.play();
      document.getElementById('card').innerHTML = `
        <h1>So Here It Is… ❤️</h1>
        <p>
          Not a maybe.
          Not someday.
          Not in another lifetime.
          <br/><br/>
          Himanshu,
          will you be my Valentine?
          <br/><br/>
          Will you choose this story — with me?
        </p>
        <div class="buttons">
          <button class="yes" onclick="sayYes()">Yes, Jalpa 💖</button>
          <button class="no" onclick="moveNo(this)">I’m Shy 🙈</button>
        </div>
      `;
    }

    function sayYes() {
      const hb = document.getElementById('heartbeat'); hb.pause();
      document.getElementById('card').innerHTML = `
        <h1>It’s You, Himanshu. Always. 💖</h1>
        <p>
          You didn’t just say yes —
          you became my favorite chapter.
          <br/><br/>
          Every tomorrow,
          every dream,
          every little forever —
          I want it with you.
          <br/><br/>
          Happy Valentine’s Day ❤️<br/>
          Forever yours,<br/>
          Jalpa 🌹
        </p>
      `;
      for (let i = 0; i < 60; i++) createPetal('❤️');
    }

    function moveNo(btn) {
      const x = Math.random() * 240 - 120;
      const y = Math.random() * 240 - 120;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function createPetal(symbol = '🌹') {
      const petal = document.createElement('span');
      petal.innerText = symbol;
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = 6 + Math.random() * 6 + 's';
      document.getElementById('petals').appendChild(petal);
      setTimeout(() => petal.remove(), 12000);
    }

    setInterval(() => createPetal('🌹'), 400);
  </script>
</body>
</html>
